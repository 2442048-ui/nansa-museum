<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>난세 박물관</title><style>body{margin:0;background:#111;color:#f5efe3;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}header{text-align:center;padding:34px 18px;border-bottom:1px solid #39342e}h1{font-size:38px;margin:0}.sub{color:#c9c0b4}.wrap{max-width:900px;margin:auto;padding:20px}.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.room,.choice{border:1px solid #403a33;border-radius:14px;background:#1c1a17;color:#f5efe3;padding:17px;text-align:left}.room b{color:#c9a35b}.panel{display:none;background:#f5efe3;color:#27231e;border-radius:18px;padding:22px;margin-top:18px}.panel.on{display:block}.hint{background:#ebe1d1;border-left:4px solid #c9a35b;padding:14px;margin:16px 0}.choice{display:block;width:100%;margin:10px 0;background:#fff;color:#27231e;border-color:#cfc4b4}.correct{outline:3px solid #69805f!important}.meta,.source{color:#746b60;font-size:14px}button{font:inherit;cursor:pointer}@media(max-width:600px){.rooms{grid-template-columns:1fr}h1{font-size:30px}}</style></head><body><header><h1>난세 박물관</h1><div class="sub">유물을 관찰하고 중국 고대사의 변화를 추론하는 인터랙티브 역사 미니게임</div></header><main class="wrap"><h2>전시실 선택</h2><div class="rooms" id="rooms"></div><section id="panel" class="panel"><div id="content"></div></section></main><script>
const D=[
["01","신에게 묻다","갑골문","상나라","상나라에서는 갑골에 점을 치고 결과를 기록했다. 제사와 점복은 국가의 중요한 의사결정과 연결되었으며, 이를 해석하는 권한도 정치적 권력과 이어졌다.","문자와 점복의 관계를 가장 잘 설명하는 것은?","점복 결과의 기록과 해석이 정치 권력과 연결되었다.","https://www.metmuseum.org/art/collection/search/42045"],
["02","하늘의 명령","모공정(毛公鼎)","서주 후기","서주 청동기의 긴 금문은 왕의 명령과 정치적 질서를 기록한다. 주는 은·주 교체를 천명으로 설명하고 군주의 덕과 책임을 정당성의 근거로 삼았다.","이 전시실에서 연결해야 할 강의 개념은?","천명: 초월적 권위의 명령이면서 인간의 덕에 따라 그 명령이 좌우될 수 있다는 사상.","https://digitalarchive.npm.gov.tw/Collection/Detail?dep=U&id=1438"],
["03","피로 이어진 나라","산반(散氏盤)","서주 후기","산반의 명문은 토지와 관련된 내용을 기록한다. 하나의 유물이 종법제 전체를 증명하는 것은 아니지만, 주대 정치질서를 혈연뿐 아니라 토지와 행정의 관계에서도 생각하게 한다.","유물의 역할을 가장 정확하게 표현한 것은?","주대 정치질서를 생각하게 하는 자료이며 종법·봉건제를 단독으로 증명하는 자료는 아니다.","https://theme.npm.edu.tw/selection/Article.aspx?lang=2&sNo=04001043"],
["04","무너지는 질서","춘추시대 청동 방호","춘추시대","서주적 질서가 약화되고 제후국이 자립하던 춘추시대의 물질문화를 보여주는 자료다. 유물 자체가 家→國의 변화를 직접 증명한다고 단정하지 않는다.","강의에서 설명한 춘추시대의 핵심 변화는?","혈연적 질서(家)에서 영토적 질서(國)로의 이행.","https://commons.wikimedia.org/wiki/File%3A-0770_-0403_Zheng_Zhong_Youfu_Bronze_Fanghu_%28wine_vessel%29_Spring_and_Autumn_Period_National_Museum_of_China_anagoria.jpg"],
["05","맹약의 시대","동물형 청동 준","춘추시대","춘추시대 제후국의 물질문화를 보여주는 자료다. 이 유물이 특정 맹약을 직접 기록한 것은 아니므로 회맹과 패자라는 새로운 정치관계를 생각하는 단서로 사용한다.","춘추시대의 새로운 정치관계를 설명하는 말은?","패자가 제후를 소집하고 맹약하는 회맹질서와 혈연 대신 인격적 유대로 맺는 임협관계.","https://commons.wikimedia.org/wiki/File%3A-0770_-403_Animal-shaped_Bronze_Zun_%28wine_vessel%29_Spring_and_Autumn_Period_National_Museum_of_China_anagoria.jpg"],
["06","살아남기 위한 개혁","전국시대 철제 괭이","전국시대","전국시대에는 철제 농기구와 우경, 수리·개간이 확산되면서 생산력이 높아졌다. 국가는 인적·물적 자원을 극대화하여 경쟁에서 살아남으려 했다.","철제 농기구와 가장 직접적으로 연결되는 것은?","농업 생산력 확대와 국가의 부국강병 기반 강화.","https://commons.wikimedia.org/wiki/File%3AWarring_States_Iron_Hoe_%289831259805%29.jpg"],
["07","백 가지의 답","전국시대 죽간","전국시대","전국시대에는 정치적 혼란과 인재 수요 속에서 학문과 지식이 확산되었다. 죽간은 문자·지식 전승을 생각하게 하는 자료이지 특정 학파 전체를 단독으로 증명하는 자료는 아니다.","강의에서 제자백가가 등장한 배경은?","혼란과 경쟁 속에서 사회 운영의 방법을 찾으려는 요구와 각국의 인재 수요가 커졌기 때문이다.","https://commons.wikimedia.org/wiki/File%3AWarring_States_Bamboo_Slips_%2810185849733%29.jpg"]];
let score=0,done=new Set(),R=document.getElementById("rooms"),P=document.getElementById("panel"),C=document.getElementById("content");
D.forEach((d,i)=>{let b=document.createElement("button");b.className="room";b.innerHTML="<b>ROOM "+d[0]+"</b><br><strong>"+d[1]+"</strong><br>"+d[2]+" · "+d[3];b.onclick=()=>open(i);R.appendChild(b)});
function open(i){let d=D[i];P.className="panel on";C.innerHTML='<div class="meta">ROOM '+d[0]+' · '+d[3]+'</div><h2>'+d[1]+'</h2><h3>🏺 '+d[2]+'</h3><div class="hint"><strong>HISTORICAL HINT · 사료 힌트</strong><br>'+d[4]+'</div><p><strong>발굴 질문</strong><br>'+d[5]+'</p><button class="choice" onclick="answer(this,'+i+')">이 자료를 바탕으로 답을 제출한다</button><p id="res"></p><p class="source">자료 출처: <a href="'+d[7]+'" target="_blank" rel="noopener">원자료 확인하기</a></p><button class="choice" onclick="P.className='panel'">전시실 목록으로</button>'}
function answer(b,i){if(done.has(i)){document.getElementById("res").textContent="이미 조사 완료했습니다.";return}done.add(i);score+=10;b.classList.add("correct");document.getElementById("res").innerHTML="✓ 조사 성공 · "+score+"점<br>"+D[i][6]}
</script></body></html>

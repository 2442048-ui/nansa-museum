<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>난세 박물관</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#f5efe3;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}header{text-align:center;padding:34px 18px;border-bottom:1px solid #39342e}h1{font-size:38px;margin:0 0 8px}.sub{color:#c9c0b4}.wrap{max-width:980px;margin:auto;padding:20px}.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.room{position:relative;transition:.2s}.room:hover{transform:translateY(-2px);border-color:#c9a35b}.room.doneRoom{border-color:#69805f}.room .status{float:right;font-size:12px;color:#8c8378}.room .status.done{color:#69805f}.room .status.now{color:#c9a35b}.room{border:1px solid #403a33;border-radius:14px;background:#1c1a17;color:#f5efe3;padding:18px;text-align:left;font:inherit;cursor:pointer}.room b{color:#c9a35b}.panel{display:none;background:#f5efe3;color:#27231e;border-radius:18px;padding:22px;margin-top:20px}.panel.on{display:block}.artifact{width:100%;max-height:430px;object-fit:contain;background:#ddd7cc;border-radius:12px;display:block;margin:15px 0;cursor:zoom-in}.hint{background:#ebe1d1;border-left:4px solid #c9a35b;padding:14px;margin:16px 0}.choice{display:block;width:100%;margin:10px 0;padding:14px;border-radius:10px;background:#fff;color:#27231e;border:1px solid #cfc4b4;font:inherit;text-align:left;cursor:pointer}.choice.correct{outline:3px solid #69805f;background:#eef4ea}.choice.wrong{outline:3px solid #a56b62;background:#f8ecea}.choice:disabled{cursor:default;opacity:.95}.observation{background:#f0ebe2;border:1px solid #d8cbbb;border-radius:12px;padding:16px;margin:18px 0}.observation label{display:block;font-weight:800;margin-bottom:8px}.observation textarea{width:100%;min-height:90px;border:1px solid #cfc4b4;border-radius:9px;padding:10px;font:inherit;resize:vertical;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.next{background:#c9a35b!important;color:#27231e!important;border-color:#c9a35b!important;font-weight:800}.progress{height:8px;background:#332f2a;border-radius:99px;overflow:hidden;margin:10px 0 20px}.progress span{display:block;height:100%;width:0;background:#c9a35b;transition:.3s}.completion{display:none;margin-top:20px;padding:24px;border:1px solid #c9a35b;border-radius:16px;background:#f5efe3;color:#27231e;text-align:center}.completion.on{display:block}.badge{font-size:42px;margin:6px}.meta,.source{color:#746b60;font-size:14px}.back{background:#27231e;color:#fff}.score{position:sticky;top:0;text-align:right;font-weight:800;color:#c9a35b;padding:8px 0}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.lightbox.on{display:flex}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}.close{position:absolute;top:18px;right:18px;background:#fff;color:#111;border:0;border-radius:50%;width:42px;height:42px;font-size:22px}@media(max-width:600px){.rooms{grid-template-columns:1fr}h1{font-size:30px}.panel{padding:16px}}
</style></head>
<body>
<header><h1>난세 박물관</h1><div class="sub">유물을 관찰하고 중국 고대사의 변화를 추론하는 인터랙티브 역사 미니게임</div></header>
<main class="wrap"><div class="score">발굴 점수 <span id="score">0</span>점 · 조사 완료 <span id="progressText">0 / 7</span></div><div class="progress"><span id="progressBar"></span></div><h2>전시실 선택</h2><p class="meta">유물을 먼저 관찰한 뒤, 사료 힌트와 강의 내용을 연결해 조사 질문을 해결해 보세요.</p><div class="rooms" id="rooms"></div><section id="panel" class="panel"><div id="content"></div></section><section id="completion" class="completion"><div class="badge">🏛️</div><h2>난세 박물관 조사 완료</h2><p>7개 전시실의 유물을 조사하고 중국 고대사의 변화 과정을 연결했습니다.</p><p><strong>최종 발굴 점수 <span id="finalScore">0</span>점</strong></p><p class="meta">관찰 → 사료 힌트 → 역사적 질문 → 강의 개념 연결</p></section></main>
<div id="lightbox" class="lightbox"><button class="close" id="close">×</button><img id="zoom" alt="유물 확대 이미지"></div>
<script>
const D=[
{no:"01",room:"신에게 묻다",name:"갑골문",era:"상나라",hint:"상나라에서는 갑골에 점을 치고 결과를 기록했다. 제사와 점복은 국가의 중요한 의사결정과 연결되었으며, 이를 해석하는 권한도 정치적 권력과 이어졌다.",q:"이 자료가 가장 직접적으로 보여주는 것은?",a:"점복 결과의 기록과 해석이 정치 권력과 연결되었다는 점이다.",correct:"C",img:"https://upload.wikimedia.org/wikipedia/commons/8/84/Shang_Oracle_Bone_%28Museum_Photo%29_%2845868930051%29.jpg",source:"The Metropolitan Museum of Art",url:"https://www.metmuseum.org/art/collection/search/42045"},
{no:"02",room:"하늘의 명령",name:"모공정(毛公鼎)",era:"서주 후기",hint:"서주 청동기의 긴 금문은 왕의 명령과 정치적 질서를 기록한다. 주는 은·주 교체를 천명으로 설명하고 군주의 덕과 책임을 정당성의 근거로 삼았다.",q:"이 전시실에서 연결해야 할 핵심 개념은?",a:"천명은 초월적 권위의 명령이며, 군주의 덕과 노력에 따라 그 명령이 좌우될 수 있다는 사상이다.",correct:"A",img:"https://upload.wikimedia.org/wikipedia/commons/e/e2/Ding_cauldron_of_Duke_Mao.jpg",source:"National Palace Museum",url:"https://digitalarchive.npm.gov.tw/Collection/Detail?dep=U&id=1438"},
{no:"03",room:"피로 이어진 나라",name:"산반(散氏盤)",era:"서주 후기",hint:"산반의 명문은 토지와 관련된 내용을 기록한다. 하나의 유물이 종법제 전체를 증명하는 것은 아니지만, 주대 정치질서를 혈연뿐 아니라 토지와 행정의 관계에서도 생각하게 한다.",q:"이 유물의 역사적 활용을 가장 정확하게 설명한 것은?",a:"주대 정치질서를 생각하게 하는 자료이며, 종법·봉건제를 단독으로 증명하는 자료는 아니다.",correct:"A",img:"https://upload.wikimedia.org/wikipedia/commons/b/b8/San_Family_Plate.JPG",source:"National Palace Museum",url:"https://theme.npm.edu.tw/selection/Article.aspx?lang=2&sNo=04001043"},
{no:"04",room:"무너지는 질서",name:"춘추시대 청동 방호",era:"춘추시대",hint:"서주적 질서가 약화되고 제후국이 자립하던 춘추시대의 물질문화를 보여주는 자료다. 유물 자체가 家→國의 변화를 직접 증명한다고 단정하지 않는다.",q:"강의에서 설명한 춘추시대의 핵심 변화는?",a:"혈연적 질서(家)에서 영토적 질서(國)로의 이행이다.",img:"https://commons.wikimedia.org/wiki/Special:FilePath/-0770_-0403_Zheng_Zhong_Youfu_Bronze_Fanghu_(wine_vessel)_Spring_and_Autumn_Period_National_Museum_of_China_anagoria.jpg?width=1400",source:"National Museum of China / Wikimedia Commons",url:"https://commons.wikimedia.org/wiki/File%3A-0770_-0403_Zheng_Zhong_Youfu_Bronze_Fanghu_%28wine_vessel%29_Spring_and_Autumn_Period_National_Museum_of_China_anagoria.jpg"},
{no:"05",room:"맹약의 시대",name:"동물형 청동 준",era:"춘추시대",hint:"춘추시대 제후국의 물질문화를 보여주는 자료다. 이 유물이 특정 맹약을 직접 기록한 것은 아니므로 회맹과 패자라는 새로운 정치관계를 생각하는 단서로 사용한다.",q:"춘추시대의 새로운 정치관계를 설명하는 말은?",a:"패자가 제후를 소집하고 맹약하는 회맹질서와 혈연 대신 인격적 유대로 맺는 임협관계이다.",correct:"A",img:"https://commons.wikimedia.org/wiki/Special:FilePath/-0770_-403_Animal-shaped_Bronze_Zun_(wine_vessel)_Spring_and_Autumn_Period_National_Museum_of_China_anagoria.jpg?width=1400",source:"National Museum of China / Wikimedia Commons",url:"https://commons.wikimedia.org/wiki/File%3A-0770_-403_Animal-shaped_Bronze_Zun_%28wine_vessel%29_Spring_and_Autumn_Period_National_Museum_of_China_anagoria.jpg"},
{no:"06",room:"살아남기 위한 개혁",name:"전국시대 철제 괭이",era:"전국시대",hint:"전국시대에는 철제 농기구와 우경, 수리·개간이 확산되면서 생산력이 높아졌다. 국가는 인적·물적 자원을 극대화하여 경쟁에서 살아남으려 했다.",q:"철제 농기구와 가장 직접적으로 연결되는 것은?",a:"농업 생산력 확대와 국가의 부국강병 기반 강화.",correct:"A",img:"https://commons.wikimedia.org/wiki/Special:FilePath/Warring_States_Iron_Hoe_(9831259805).jpg?width=1400",source:"Wikimedia Commons / Chinese historical collection",url:"https://commons.wikimedia.org/wiki/File%3AWarring_States_Iron_Hoe_%289831259805%29.jpg"},
{no:"07",room:"백 가지의 답",name:"전국시대 죽간",era:"전국시대",hint:"전국시대에는 정치적 혼란과 인재 수요 속에서 학문과 지식이 확산되었다. 죽간은 문자·지식 전승을 생각하게 하는 자료이지 특정 학파 전체를 단독으로 증명하는 자료는 아니다.",q:"제자백가가 등장한 배경은?",a:"혼란과 경쟁 속에서 사회 운영의 방법을 찾으려는 요구와 각국의 인재 수요가 커졌기 때문이다.",correct:"A",img:"https://commons.wikimedia.org/wiki/Special:FilePath/Warring_States_Bamboo_Slips_(10185849733).jpg?width=1400",source:"Wikimedia Commons",url:"https://commons.wikimedia.org/wiki/File%3AWarring_States_Bamboo_Slips_%2810185849733%29.jpg"}];
const OPTIONS=[
["B","왕의 군사 훈련을 기록하는 일이 정치 권력과 연결되었다.","C","점복 결과를 기록하고 해석하는 일이 정치 권력과 연결되었다.","A","농업 생산량을 계산하는 일이 정치 권력과 연결되었다.","D","제후 간 영토 협정을 기록하는 일이 정치 권력과 연결되었다."],
["C","군현제","A","천명사상","D","제자백가","B","정전제"],
["D","전국시대의 철제 농기구를 직접 보여주는 자료이다.","B","춘추시대 회맹의 맹약문을 그대로 기록한 자료이다.","C","상나라 갑골문을 대표하는 자료이다.","A","주대의 정치질서를 생각하게 하는 자료이며 종법·봉건제를 단독으로 증명하지 않는다."],
["B","제자백가에서 신정정치로의 이행","D","봉건제에서 갑골 점복으로의 이행","A","혈연적 질서(家)에서 영토적 질서(國)로의 이행","C","철제 농기구에서 청동기 제작으로의 이행"],
["D","갑골 점복을 통한 신정정치","C","철제 농기구를 통한 농업혁명","B","적장자 상속을 중심으로 한 종법제","A","패자가 제후를 소집하고 맹약하는 회맹질서와 임협관계"],
["C","왕실의 제사 의례만을 확대","A","농업 생산력 확대와 국가의 부국강병 기반 강화","D","제후의 혈연관계를 강화","B","문자의 발명과 갑골 점복을 시작"],
["B","상나라의 갑골 점복을 폐지하려는 요구","D","서주의 적장자 상속을 강화하려는 요구","C","춘추시대 회맹을 금지하려는 요구","A","혼란과 경쟁 속에서 사회 운영의 방법을 찾으려는 요구와 각국의 인재 수요"]
];
let score=0,done=new Set();const rooms=document.getElementById("rooms"),panel=document.getElementById("panel"),content=document.getElementById("content"),scoreEl=document.getElementById("score"),light=document.getElementById("lightbox"),zoom=document.getElementById("zoom");
D.forEach((d,i)=>{const b=document.createElement("button");b.className="room";b.dataset.index=i;b.innerHTML="<span class=\"status\">미조사</span><b>ROOM "+d.no+"</b><br><strong>"+d.room+"</strong><br>"+d.name+" · "+d.era;b.addEventListener("click",()=>openRoom(i));rooms.appendChild(b)});
function openRoom(i){
const d=D[i];panel.className="panel on";content.innerHTML="";
const meta=document.createElement("div");meta.className="meta";meta.textContent="ROOM "+d.no+" · "+d.era;
const h=document.createElement("h2");h.textContent=d.room;
const n=document.createElement("h3");n.textContent="🏺 "+d.name;
const intro=document.createElement("p");intro.textContent="먼저 유물을 관찰하고, 눈에 보이는 사실과 역사적 해석을 구분해 보세요.";
const img=document.createElement("img");img.className="artifact";img.alt=d.name+" 실제 유물 사진";img.src=d.img;
img.addEventListener("click",()=>{if(img.naturalWidth){zoom.src=d.img;light.className="lightbox on"}else{window.open(d.url,"_blank")}});
img.onerror=()=>{img.removeAttribute("src");img.alt=d.name+" 사진을 불러오지 못했습니다. 아래 원자료 확인을 이용하세요.";img.style.padding="70px 20px";img.style.cursor="default";img.parentElement};
const obs=document.createElement("div");obs.className="observation";
obs.innerHTML="<label>🔎 유물 관찰 기록</label><div class='meta'>사진에서 눈에 띄는 형태·문자·재질 등을 한두 문장으로 기록해 보세요. (선택)</div>";
const ta=document.createElement("textarea");ta.placeholder="예: 청동으로 만들어졌으며 표면에 문자가 보인다…";obs.appendChild(ta);
const hint=document.createElement("div");hint.className="hint";hint.innerHTML="<strong>HISTORICAL HINT · 사료 힌트</strong><br>"+d.hint;
const q=document.createElement("p");q.innerHTML="<strong>발굴 질문</strong><br>"+d.q;
const box=document.createElement("div");
OPTIONS[i].forEach((text,j)=>{if(j%2===0){const b=document.createElement("button");b.className="choice";b.textContent=OPTIONS[i][j]+"  "+OPTIONS[i][j+1];b.addEventListener("click",()=>answer(b,i,OPTIONS[i][j],box));box.appendChild(b)}});
const res=document.createElement("p");res.id="res";
const next=document.createElement("button");next.className="choice next";next.style.display="none";next.textContent=i<6?"다음 전시실 조사하기 →":"🏛️ 전체 조사 완료하기";
next.addEventListener("click",()=>{panel.className="panel";if(i<6){openRoom(i+1)}else{showCompletion()}});
const src=document.createElement("p");src.className="source";src.innerHTML="소장·자료 출처: <strong>"+d.source+"</strong> · <a href='"+d.url+"' target='_blank' rel='noopener'>원자료 확인</a>";
const back=document.createElement("button");back.className="choice";back.textContent="전시실 목록으로";back.addEventListener("click",()=>panel.className="panel");
content.append(meta,h,n,intro,img,obs,hint,q,box,res,next,src,back);panel.scrollIntoView({behavior:"smooth"})
}
function answer(btn,i,val,box){
const res=document.getElementById("res");
if(done.has(i)){res.textContent="이미 조사 완료한 전시실입니다.";return}
if(val!==D[i].correct){
btn.classList.add("wrong");
res.innerHTML="✕ 아직 정답이 아닙니다.<br>유물이 직접 보여주는 내용과 강의에서 배운 개념을 구분해 다시 생각해 보세요.";
return
}
done.add(i);score+=10;scoreEl.textContent=score;
btn.classList.add("correct");
[...box.querySelectorAll("button")].forEach(x=>x.disabled=true);
res.innerHTML="<strong>✓ 조사 성공 · +10점</strong><br>"+D[i].a;
document.querySelectorAll(".room")[i].classList.add("doneRoom");
document.querySelectorAll(".room")[i].querySelector(".status").textContent="✓ 조사 완료";
document.querySelectorAll(".room")[i].querySelector(".status").classList.add("done");
updateProgress();
const next=document.querySelector(".next");if(next)next.style.display="block";
}
function updateProgress(){
const n=done.size;document.getElementById("progressText").textContent=n+" / 7";
document.getElementById("progressBar").style.width=(n/7*100)+"%";
}
function showCompletion(){
document.getElementById("finalScore").textContent=score;
document.getElementById("completion").className="completion on";
document.getElementById("completion").scrollIntoView({behavior:"smooth"});
}
document.getElementById("close").addEventListener("click",()=>light.className="lightbox");light.addEventListener("click",e=>{if(e.target===light)light.className="lightbox"});
</script></body></html>
